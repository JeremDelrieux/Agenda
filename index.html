function applySettings() {
  const s = D.settings, root = document.documentElement;
  let th = s.theme; if (th === 'auto') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.dataset.theme = th;
  root.style.setProperty('--accent', s.accent); root.style.setProperty('--accent-text', textOn(s.accent));
  root.style.setProperty('--fs', s.fontSize + 'px'); root.style.setProperty('--hour-h', s.hourH + 'px');
  document.body.dataset.evstyle = s.evStyle; document.body.dataset.density = s.density;
  document.body.classList.toggle('side-closed', !s.sidebarOpen);
}
const onSettingChange = () => { save(); applySettings(); render(); };

function ctlHTML(it) {
  const s = D.settings, v = s[it.k];
  if (it.t === 'sw') return `<label class="switch"><input type="checkbox" data-k="${it.k}" ${v ? 'checked' : ''}><i></i></label>`;
  if (it.t === 'seg') return `<div class="seg">${it.o.map(([val, lb]) => `<button type="button" data-k="${it.k}" data-v="${val}" class="${v === val ? 'on' : ''}">${lb}</button>`).join('')}</div>`;
  if (it.t === 'sel') return `<select class="inp" data-k="${it.k}" ${it.num ? 'data-num' : ''}>${SELECTS[it.k].map(([val, lb]) => `<option value="${val}"${String(v) === String(val) ? ' selected' : ''}>${lb}</option>`).join('')}</select>`;
  if (it.t === 'calsel') return `<select class="inp" data-k="${it.k}">${D.cals.map(c => `<option value="${c.id}"${(v || D.cals[0].id) === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  if (it.t === 'range') return `<input type="range" data-k="${it.k}" data-num min="${it.min}" max="${it.max}" step="${it.step}" value="${v}" style="width:150px"><span class="muted" data-out="${it.k}" style="min-width:48px;text-align:right">${it.f(v)}</span>`;
  if (it.t === 'num') return `<input type="number" class="inp" data-k="${it.k}" data-num min="${it.min}" max="${it.max}" value="${v}" style="width:76px"><span class="muted">${it.u || ''}</span>`;
  if (it.t === 'accent') return `<div class="swatches">${ACCENTS.map(c => `<button type="button" class="sw${v === c ? ' on' : ''}" data-k="accent" data-v="${c}" style="--c:${c}"></button>`).join('')}<input type="color" data-k="accent" value="${v}"></div>`;
  return '';
}
const groupHTML = items => items.map(it => `<div class="srow"><div class="l">${it.l}${it.d ? `<small>${it.d}</small>` : ''}</div><div class="c">${ctlHTML(it)}</div></div>`).join('');

function openSettings(tab = 'look') {
  const tabs = [['look', 'Apparence'], ['cal', 'Calendrier'], ['org', 'Organisation'], ['rem', 'Rappels'], ['data', 'Données']];
  const m = openModal(`<header><h2>Réglages</h2><button class="ibtn" data-close title="Fermer (Échap)">${ic('x')}</button></header>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div><div class="bd" id="setBody"></div>`, { cls: 'drawer', right: true });
  const body = $('#setBody', m.el);
  const draw = t => {
    tab = t; $$('.tabs button', m.el).forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    if (t === 'look' || t === 'cal') body.innerHTML = `<div class="setg">${groupHTML(SETTING_GROUPS[t])}</div>`;
    else if (t === 'org') drawOrg(body);
    else if (t === 'rem') drawRem(body);
    else drawData(body);
  };
  $('.tabs', m.el).addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) draw(b.dataset.tab); });
  body.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    D.settings[b.dataset.k] = isNaN(b.dataset.v) || b.dataset.v === '' ? b.dataset.v : +b.dataset.v;
    onSettingChange(); draw(tab);
  });
  body.addEventListener('input', e => {
    const el = e.target; if (!el.dataset.k || el.tagName === 'BUTTON') return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num !== undefined || el.type === 'number' || el.type === 'range') v = +v;
    if (el.type === 'number' && (isNaN(v) || v < +el.min || v > +el.max)) return;
    D.settings[el.dataset.k] = v;
    const out = $(`[data-out="${el.dataset.k}"]`, body); if (out) { const it = SETTING_GROUPS.look.find(x => x.k === el.dataset.k); out.textContent = it.f(v); }
    onSettingChange();
    if (el.dataset.k === 'accent') $$('.sw', body).forEach(s => s.classList.toggle('on', s.dataset.v === v));
  });
  draw(tab);
  return m;
}

/* --- Étiquettes & agendas --- */
function drawOrg(body) {
  body.innerHTML = `<div class="setg"><h3>Étiquettes</h3><div id="tagMgr"></div><div class="mgr-row"><input class="inp" id="addTag" placeholder="Nouvelle étiquette… (Entrée)"><button class="btn" id="addTagBtn">${ic('plus', 16)} Ajouter</button></div>
    <small class="muted">Les étiquettes se cumulent sur un événement. La couleur de l'événement vient de sa première étiquette (réglable dans Apparence).</small>
    <h3 style="margin-top:22px">Agendas</h3><div id="calMgr"></div><div class="mgr-row"><input class="inp" id="addCal" placeholder="Nouvel agenda… (Entrée)"><button class="btn" id="addCalBtn">${ic('plus', 16)} Ajouter</button></div>
    <small class="muted">Un agenda regroupe des événements (ex. « Famille »). Tu peux tout garder dans un seul agenda global et t'organiser par étiquettes.</small></div>`;
  const draw = () => {
    $('#tagMgr', body).innerHTML = D.tags.map(t => `<div class="mgr-row" data-id="${t.id}"><input type="color" value="${t.color}" data-f="color"><input class="inp emo" data-f="emoji" maxlength="4" value="${esc(t.emoji || '')}" placeholder="🙂" title="Icône (emoji)"><input class="inp" data-f="name" value="${esc(t.name)}"><button class="ibtn" data-del title="Supprimer">${ic('trash', 17)}</button></div>`).join('');
    $('#calMgr', body).innerHTML = D.cals.map(c => `<div class="mgr-row" data-id="${c.id}"><input type="color" value="${c.color}" data-f="color"><input class="inp" data-f="name" value="${esc(c.name)}"><button class="ibtn" data-del title="Supprimer">${ic('trash', 17)}</button></div>`).join('');
  };
  draw();
  const upd = debounce(() => { save(); render(); }, 150);
  const handler = (list, kind) => {
    $(kind === 'tag' ? '#tagMgr' : '#calMgr', body).addEventListener('input', e => {
      const row = e.target.closest('[data-id]'), f = e.target.dataset.f; if (!row || !f) return;
      const o = list().find(x => x.id === row.dataset.id); if (!o) return;
      if (f === 'name' && !e.target.value.trim()) return;
      o[f] = e.target.value; upd();
    });
    $(kind === 'tag' ? '#tagMgr' : '#calMgr', body).addEventListener('click', async e => {
      const b = e.target.closest('[data-del]'); if (!b) return;
      const id = b.closest('[data-id]').dataset.id;
      if (kind === 'tag') {
        const t = tagById(id), n = D.events.filter(x => x.tags?.includes(id)).length;
        if (!await confirmBox(`Supprimer l'étiquette « ${t.name} » ?`, n ? `Elle sera retirée de ${n} événement${n > 1 ? 's' : ''} (les événements ne sont pas supprimés).` : 'Cette étiquette n\'est utilisée par aucun événement.', 'Supprimer', true)) return;
        mutate(() => { D.tags = D.tags.filter(x => x.id !== id); D.events.forEach(x => x.tags = (x.tags || []).filter(i => i !== id)); });
      } else {
        if (D.cals.length < 2) return toast('Il faut garder au moins un agenda');
        const c = calById(id), n = D.events.filter(x => x.calId === id).length, to = D.cals.find(x => x.id !== id);
        if (!await confirmBox(`Supprimer l'agenda « ${c.name} » ?`, n ? `Ses ${n} événement${n > 1 ? 's' : ''} seront déplacés vers « ${esc(to.name)} ».` : 'Cet agenda est vide.', 'Supprimer', true)) return;
        mutate(() => { D.cals = D.cals.filter(x => x.id !== id); D.events.forEach(x => { if (x.calId === id) x.calId = to.id; }); if (D.settings.defaultCal === id) D.settings.defaultCal = to.id; });
      }
      draw();
    });
  };
  handler(() => D.tags, 'tag'); handler(() => D.cals, 'cal');
  const addTag = () => { const n = $('#addTag', body).value.trim(); if (!n) return; if (findTagByName(n)) return toast('Cette étiquette existe déjà'); mutate(() => newTag(n)); $('#addTag', body).value = ''; draw(); $('#addTag', body).focus(); };
  const addCal = () => { const n = $('#addCal', body).value.trim(); if (!n) return; mutate(() => D.cals.push({ id: uid(), name: n, color: PALETTE[(D.cals.length * 3 + 8) % PALETTE.length], visible: true })); $('#addCal', body).value = ''; draw(); $('#addCal', body).focus(); };
  $('#addTagBtn', body).onclick = addTag; $('#addCalBtn', body).onclick = addCal;
  $('#addTag', body).addEventListener('keydown', e => { if (e.key === 'Enter') addTag(); });
  $('#addCal', body).addEventListener('keydown', e => { if (e.key === 'Enter') addCal(); });
}

/* --- Données --- */
function drawData(body) {
  const kb = Math.round(JSON.stringify(D).length / 1024), last = D.meta.lastBackup;
  body.innerHTML = `<div class="setg">
    <div class="srow"><div class="l">Contenu<small>${D.events.length} événement(s) · ${D.tags.length} étiquette(s) · ${D.cals.length} agenda(s) · ~${kb} Ko</small></div></div>
    <div class="srow"><div class="l">Dernière sauvegarde complète<small>${last ? new Date(last).toLocaleString('fr-FR') : 'Jamais — pense à exporter régulièrement.'}</small></div><div class="c"><button class="btn sm primary" id="dJson">${ic('download', 15)} Sauvegarder (.json)</button></div></div>
    <div class="srow"><div class="l">Restaurer une sauvegarde<small>Remplace toutes les données actuelles (annulable).</small></div><div class="c"><button class="btn sm" id="dJsonIn">${ic('upload', 15)} Restaurer…</button></div></div>
    <div class="srow"><div class="l">Exporter en .ics<small>Compatible KOrganizer, Thunderbird, Google Agenda, etc.</small></div><div class="c"><button class="btn sm" id="dIcs">${ic('download', 15)} Exporter</button></div></div>
    <div class="srow"><div class="l">Importer un .ics<small>Ajoute les événements d'un autre agenda.</small></div><div class="c"><button class="btn sm" id="dIcsIn">${ic('upload', 15)} Importer…</button></div></div>
    <div class="srow"><div class="l">Supprimer les exemples</div><div class="c"><button class="btn sm" id="dDemo">Supprimer</button></div></div>
    <div class="srow"><div class="l">Tout effacer<small>Supprime tous les événements et remet les réglages à zéro.</small></div><div class="c"><button class="btn sm danger" id="dReset">Réinitialiser…</button></div></div>
    <input type="file" id="fileIn" hidden></div>`;
  const pick = (accept, cb) => { const inp = $('#fileIn', body); inp.accept = accept; inp.value = ''; inp.onchange = () => { const f = inp.files[0]; if (f) f.text().then(cb); }; inp.click(); };
  $('#dJson', body).onclick = () => { exportJSON(); drawData(body); };
  $('#dIcs', body).onclick = exportICS;
  $('#dJsonIn', body).onclick = () => pick('.json,application/json', async t => {
    if (!await confirmBox('Restaurer cette sauvegarde ?', 'Les données actuelles seront remplacées.', 'Restaurer', true)) return;
    try { importJSON(t); applySettings(); render(); drawData(body); toast('Sauvegarde restaurée'); } catch (e) { toast('⚠️ ' + e.message); }
  });
  $('#dIcsIn', body).onclick = () => pick('.ics,text/calendar', t => importICSDialog(t, () => drawData(body)));
  $('#dDemo', body).onclick = () => { removeDemo(); drawData(body); };
  $('#dReset', body).onclick = async () => {
    if (!await confirmBox('Tout effacer ?', 'Tous tes événements, étiquettes et réglages seront supprimés. (Tu peux annuler juste après avec Ctrl+Z.)', 'Tout effacer', true)) return;
    pushUndo(); const keepBackup = D.meta.lastBackup; D = defaultData(); D.meta.lastBackup = keepBackup; save(); applySettings(); render(); drawData(body); toast('Agenda réinitialisé', { action: 'Annuler', fn: undo });
  };
}
function removeDemo() { mutate(() => { D.events = D.events.filter(e => !e.demo); D.meta.demo = false; }); toast('Exemples supprimés'); }
function importICSDialog(text, done) {
  const m = openModal(`<header><h2>Importer un fichier .ics</h2></header><div class="bd">
    <div class="frow"><label>Agenda</label><div class="ctl"><select class="inp" id="impCal">${D.cals.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div>
    <label class="line" style="gap:10px;cursor:pointer"><span class="switch"><input type="checkbox" id="impDup" checked><i></i></span> Ignorer les événements déjà présents (même identifiant)</label></div>
    <footer><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn primary" id="impGo">Importer</button></footer>`, { cls: 'sm' });
  $('#impGo', m.el).onclick = () => {
    const calId = $('#impCal', m.el).value, dedupe = $('#impDup', m.el).checked;
    try {
      pushUndo(); const st = parseICS(text, { calId, dedupe }); save(); m.close(); render(); done?.();
      toast(`${st.added} événement(s) importé(s)${st.skipped ? `, ${st.skipped} déjà présent(s)` : ''}${st.ignored ? `, ${st.ignored} récurrence(s) non gérée(s)` : ''}`);
    } catch (e) { toast('⚠️ Fichier illisible : ' + e.message); }
  };
}

/* ===== Application : coque, barre latérale, raccourcis, rappels ===== */
const VIEWS = [['month', 'Mois'], ['week', 'Semaine'], ['day', 'Jour'], ['agenda', 'Agenda'], ['year', 'Année']];

function render() { renderTop(); renderSide(); renderBanner(); renderMain(); }

/* --- Barre du haut --- */
function titleOf() {
  const a = ymd(S.anchor);
  if (S.search.trim()) return `Recherche <small>« ${esc(S.search.trim())} »</small>`;
  switch (S.view) {
    case 'month': return cap(fmt(S.anchor, { month: 'long', year: 'numeric' }));
    case 'week': {
      const gs = weekStartDn(S.anchor), ge = gs + 6, y1 = ymd(gs), y2 = ymd(ge);
      const r = y1.m === y2.m ? `${y1.d} – ${y2.d} ${fmt(ge, { month: 'long', year: 'numeric' })}` : `${y1.d} ${fmt(gs, { month: 'short' })} – ${y2.d} ${fmt(ge, { month: 'short', year: 'numeric' })}`;
      return `${r} <small>Semaine ${isoWeek(gs + 3)}</small>`;
    }
    case 'day': return `${cap(fmt(S.anchor, { weekday: 'long', day: 'numeric', month: 'long' }))} <small>${a.y}</small>`;
    case 'agenda': return `Agenda <small>à partir du ${fmt(S.anchor, { day: 'numeric', month: 'long' })}</small>`;
    case 'year': return String(a.y);
  }
}
function renderTop() {
  $('#title').innerHTML = titleOf();
  $$('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  const dark = document.documentElement.dataset.theme !== 'light';
  $('#btnTheme').innerHTML = ic(dark ? 'sun' : 'moon');
  document.title = `Agenda — ${$('#title').textContent.replace(/\s+/g, ' ').trim()}`;
}
function shift(dir) {
  S.search = ''; $('#q').value = '';
  const a = S.anchor;
  S.anchor = { month: () => addMonths(a, dir), week: () => a + 7 * dir, day: () => a + dir, agenda: () => a + dir * Math.min(30, D.settings.agendaDays), year: () => addMonths(a, 12 * dir) }[S.view]();
  S.mini = S.anchor; render();
}
function setView(v) { if (S.view !== v) S.resetScroll = true; S.view = v; render(); }
function goToday() { S.anchor = todayDn(); S.mini = S.anchor; S.search = ''; $('#q').value = ''; S.resetScroll = true; render(); }

/* --- Barre latérale --- */
function dayCounts(from, to) {
  const c = new Map();
  for (const ev of D.events) if (isVisible(ev)) for (const o of occsInRange(ev, from, to))
    for (let d = Math.max(o.sdn, from); d <= Math.min(o.edn, to); d++) c.set(d, (c.get(d) || 0) + 1);
  return c;
}
/** Bloc-notes indépendant : le textarea n'est jamais reconstruit pendant la frappe. */
function renderNotes() {
  const w = $('#notesWrap');
  if (!D.settings.notepad) { w.innerHTML = ''; return; }
  let ta = $('#notes');
  if (!ta) {
    w.innerHTML = `<div class="sec-h"><span>Bloc-notes</span></div><textarea id="notes" spellcheck="true" placeholder="Notes libres, listes, idées…"></textarea><div class="nfoot" id="nfoot"></div>`;
    ta = $('#notes');
    const cnt = () => { $('#nfoot').textContent = ta.value ? ta.value.length + ' car.' : ''; };
    ta.addEventListener('input', () => { D.notes = ta.value; save(); cnt(); });
    ta.addEventListener('pointerup', () => { if (ta.offsetHeight > 20 && ta.offsetHeight !== D.meta.notesH) { D.meta.notesH = ta.offsetHeight; save(); } });
  }
  if (document.activeElement !== ta && ta.value !== (D.notes || '')) ta.value = D.notes || '';
  if (D.meta.notesH) ta.style.setProperty('--nh', D.meta.notesH + 'px');
  $('#nfoot').textContent = ta.value ? ta.value.length + ' car.' : '';
}
function renderSide() {
  const s = D.settings;
  const mw = $('#miniWrap');
  if (s.miniCal) {
    const y = ymd(S.mini), first = dnOf(y.y, y.m, 1), gs = weekStartDn(first), ge = weekStartDn(dnOf(y.y, y.m, daysInMonth(y.y, y.m))) + 6;
    const ws = weekStartDn(S.anchor);
    mw.innerHTML = `<div class="mini"><div class="mini-h"><b>${fmt(S.mini, { month: 'long', year: 'numeric' })}</b><span><button class="ibtn" data-mn="-1" title="Mois précédent">${ic('left', 16)}</button><button class="ibtn" data-mn="1" title="Mois suivant">${ic('right', 16)}</button></span></div>`
      + monthGridHTML(y.y, y.m, { counts: dayCounts(gs, ge), dots: true, sel: S.view === 'day' || S.view === 'agenda' ? S.anchor : null, week: S.view === 'week' ? [ws, ws + 6] : null }) + '</div>';
  } else mw.innerHTML = '';
  renderNotes();
  /* Agendas */
  $('#calsWrap').innerHTML = `<div class="sec-h"><span>Agendas</span><span class="acts"><button data-org>Gérer</button></span></div><div class="lst">`
    + D.cals.map(c => `<div class="lrow${c.visible !== false ? ' on' : ''}" data-cal="${c.id}" style="--c:${c.color};--ct:${textOn(c.color)}"><span class="cb">${ic('check', 12)}</span><span class="nm">${esc(c.name)}</span><span class="ct">${D.events.filter(e => e.calId === c.id).length}</span></div>`).join('') + '</div>';
  /* Étiquettes */
  const cnt = id => D.events.filter(e => e.tags?.includes(id)).length, nt = D.events.filter(e => !(e.tags || []).some(tagById)).length;
  $('#tagsWrap').innerHTML = `<div class="sec-h"><span>Étiquettes</span><span class="acts"><button data-tall="1">Tout</button><button data-tall="0">Aucun</button><button data-org>Gérer</button></span></div><div class="lst">`
    + D.tags.map(t => `<div class="lrow${t.visible !== false ? ' on' : ''}" data-tag="${t.id}" style="--c:${t.color};--ct:${textOn(t.color)}"><span class="cb">${ic('check', 12)}</span><span class="nm">${esc(tagLabel(t))}</span><span class="ct">${cnt(t.id)}</span></div>`).join('')
    + `<div class="lrow${D.meta.showUntagged !== false ? ' on' : ''}" data-untagged style="--c:#94a3b8;--ct:#fff"><span class="cb">${ic('check', 12)}</span><span class="nm">Sans étiquette</span><span class="ct">${nt}</span></div></div>`;
}
function renderBanner() {
  const b = $('#banner'), has = D.events.some(e => e.demo);
  const n = D.events.filter(e => !e.demo).length, ref = D.meta.lastBackup || D.meta.created || Date.now();
  if (!(D.meta.demo && has) && n >= 5 && Date.now() - ref > 30 * 86400000) {
    b.style.display = 'flex';
    b.innerHTML = `<span>💾 Dernière sauvegarde : ${D.meta.lastBackup ? 'il y a plus de 30 jours' : 'jamais'}. Tes données ne vivent que dans ce navigateur — pense à les exporter.</span><span class="spacer"></span><button class="btn sm primary" id="bBackup">Sauvegarder maintenant</button>`;
  } else if (D.meta.demo && has) { b.style.display = 'flex'; b.innerHTML = `<span>✨ Des événements d'exemple sont affichés pour te montrer le rendu.</span><span class="spacer"></span><button class="btn sm" id="bKeep">Garder</button><button class="btn sm primary" id="bRm">Supprimer les exemples</button>`; }
  else b.style.display = 'none';
}

/* --- Ajout rapide en langage naturel --- */
const MONTHS_FR = ['janv', 'fevr', 'mars', 'avr', 'mai', 'juin', 'juil', 'aout', 'sept', 'oct', 'nov', 'dec'];
function parseQuick(text) {
  let s = ' ' + text.trim() + ' ';
  const out = { tags: [], loc: '', rec: null, title: '' };
  const today = todayDn();
  s = s.replace(/#([\p{L}\d_-]+)/gu, (m, n) => { const t = findTagByName(n) || newTag(n.replace(/_/g, ' ')); out.tags.push(t.id); return ' '; });
  s = s.replace(/@"([^"]+)"|@(\S+)/, (m, a, b) => { out.loc = a || b; return ' '; });
  const rx = (re, fn) => { const m = re.exec(s); if (!m) return false; s = s.replace(re, ' '); fn(m); return true; };
  rx(/\b(tous les jours|chaque jour|quotidien(?:ne)?)\b/i, () => out.rec = { freq: 'DAILY', interval: 1 });
  rx(/\b(chaque semaine|toutes les semaines|hebdo(?:madaire)?)\b/i, () => out.rec = { freq: 'WEEKLY', interval: 1, byday: [] });
  rx(/\b(chaque mois|tous les mois|mensuel(?:le)?)\b/i, () => out.rec = { freq: 'MONTHLY', interval: 1, byday: [], monthMode: 'day' });
  rx(/\b(chaque ann[ée]e|tous les ans|annuel(?:le)?)\b/i, () => out.rec = { freq: 'YEARLY', interval: 1, byday: [] });
  let dn = null;
  rx(/\b(aujourd'?hui|ajd)\b/i, () => dn = today) ||
    rx(/\bapr[eè]s[- ]demain\b/i, () => dn = today + 2) ||
    rx(/\bdemain\b/i, () => dn = today + 1) ||
    rx(/\b(?:le\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, m => { const y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : ymd(today).y; dn = dnOf(y, +m[2] - 1, +m[1]); if (!m[3] && dn < today) dn = dnOf(y + 1, +m[2] - 1, +m[1]); }) ||
    rx(/\b(?:le\s+)?(\d{1,2})\s+(janv(?:ier)?|f[ée]vr(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|ao[uû]t?|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|d[ée]c(?:embre)?)\.?(?:\s+(\d{4}))?/i, m => {
      const mi = MONTHS_FR.findIndex(x => norm(m[2]).startsWith(x.slice(0, 3))); const y = m[3] ? +m[3] : ymd(today).y; dn = dnOf(y, mi, +m[1]); if (!m[3] && dn < today) dn = dnOf(y + 1, mi, +m[1]);
    }) ||
    rx(/\b(?:(?:ce|le|prochain)\s+)?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?:\s+prochain)?\b/i, m => { const wd = WD_LONG.indexOf(m[1].toLowerCase()); dn = today + (((wd - dowOf(today) + 6) % 7) + 1); }) ||
    rx(/\ble\s+(\d{1,2})\b(?!\s*[h:])/i, m => { const y = ymd(today); dn = dnOf(y.y, y.m, +m[1]); if (dn < today) dn = addMonths(dn, 1); });
  let st = null, et = null;
  rx(/(?:\b[àa]\s*)?\b(\d{1,2})\s*[h:]\s*(\d{2})?(?:\s*(?:-|à|a|jusqu'?[àa])\s*(\d{1,2})\s*[h:]\s*(\d{2})?)?/i, m => {
    st = clamp(+m[1], 0, 23) * 60 + (+m[2] || 0); if (m[3]) et = clamp(+m[3], 0, 24) * 60 + (+m[4] || 0);
  });
  out.title = s.replace(/\s+/g, ' ').replace(/^\s*(?:le|à|a|pour|ce)\s+/i, '').replace(/\s+(?:le|à|a|pour|ce|du)\s*$/i, '').trim();
  const anniv = out.tags.some(id => norm(tagById(id)?.name) === 'anniversaire');
  out.dn = dn ?? today; out.st = st; out.et = et;
  if (anniv && !out.rec) out.rec = { freq: 'YEARLY', interval: 1, byday: [] };
  return out;
}
function quickAdd(text) {
  const p = parseQuick(text); if (!p.title) return toast('Il manque un titre');
  const e = blankEvent(p.dn, p.st ?? 9 * 60, p.et ?? null, p.st == null);
  e.title = p.title; e.loc = p.loc; e.tags = p.tags; e.rec = p.rec;
  if (e.rec?.freq === 'WEEKLY' && !e.rec.byday.length) e.rec.byday = [dowOf(p.dn)];
  mutate(() => D.events.push(e));
  S.anchor = p.dn; S.mini = p.dn; render();
  toast(`✔ « ${e.title} » — ${cap(fmt(p.dn, { weekday: 'short', day: 'numeric', month: 'short' }))}${p.st != null ? ' ' + minStr(p.st) : ''}`, { action: 'Annuler', fn: undo });
}

/* --- Rappels --- */
const FIRED_KEY = 'agenda-local.fired';
function fireNotice(title, body) {
  toast(`🔔 ${title}${body ? ' — ' + body : ''}`, { cls: 'rem', ttl: 0 });
  try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) { /* ignoré */ }
}
function checkReminders() {
  if (!D.settings.notifications) return;
  const now = Date.now(), t = todayDn(); let fired = {}, changed = false;
  try { fired = JSON.parse(localStorage.getItem(FIRED_KEY) || '{}'); } catch (e) { fired = {}; }
  for (const ev of D.events) {
    if (!ev.reminders?.length) continue;
    for (const o of occsInRange(ev, t - 1, t + 8)) {
      const startMs = dnToDate(o.sdn, o.allDay ? D.settings.allDayReminderHour * 60 : o.st).getTime();
      const endMs = o.allDay ? dnToDate(o.edn + 1).getTime() : dnToDate(o.edn, o.et).getTime();
      if (endMs < now) continue;
      for (const m of ev.reminders) {
        const fire = startMs - m * 60000, key = `${ev.id}|${o.sdn}|${m}`;
        if (fire <= now && fire > now - 6 * 3600000 && !fired[key]) {
          fired[key] = now; changed = true;
          fireNotice(occTitle(o), `${o.allDay ? 'journée entière' : fmtTime(o.st)}${m ? ' · ' + remLabel(m).replace('avant', 'avant') : ''}`);
        }
      }
    }
  }
  if (changed) { for (const k in fired) if (now - fired[k] > 3 * 86400000) delete fired[k]; try { localStorage.setItem(FIRED_KEY, JSON.stringify(fired)); } catch (e) { /* ignoré */ } }
}

/* --- Aide --- */
function showHelp() {
  const rows = [['N', 'Nouvel événement'], ['T', "Aller à aujourd'hui"], ['← →', 'Période précédente / suivante'], ['M  W  D  A  Y', 'Vues Mois · Semaine · Jour · Agenda · Année'],
    ['/', 'Rechercher'], ['S', 'Réglages'], ['B', 'Afficher / masquer la barre latérale'], ['Ctrl + Z', 'Annuler'], ['Ctrl + Maj + Z', 'Rétablir'], ['Échap', 'Fermer / annuler un glisser'], ['Ctrl + Entrée', "Enregistrer dans l'éditeur"]];
  openModal(`<header><h2>Raccourcis clavier</h2><button class="ibtn" data-close>${ic('x')}</button></header><div class="bd"><div class="helpg">${rows.map(([k, d]) => `<div class="k">${k.split('  ').map(x => `<kbd>${x}</kbd>`).join('')}</div><div>${d}</div>`).join('')}</div>
    <div class="muted" style="font-size:.9em;line-height:1.5"><b>Astuces</b> · Glisse un événement pour le déplacer, tire son bord inférieur pour changer sa durée, glisse sur une colonne vide pour en créer un.<br>Ajout rapide : <i>RDV dentiste demain 14h30 #RDV @Cabinet</i>, <i>Anniversaire Léa le 12/03 #Anniversaire</i>, <i>Yoga chaque semaine mardi 18h-19h</i>.</div></div>`, { cls: 'sm' });
}

/* --- Initialisation --- */
function init() {
  load(); applySettings();
  S.view = D.settings.defaultView || 'month';
  $('#viewSeg').innerHTML = VIEWS.map(([k, l]) => `<button data-v="${k}" title="${l} (${k === 'agenda' ? 'A' : k === 'year' ? 'Y' : k[0].toUpperCase()})">${l}</button>`).join('');
  $('#btnSide').innerHTML = ic('menu'); $('#btnSettings').innerHTML = ic('sliders'); $('#btnHelp').innerHTML = ic('help');
  $('#btnPrev').innerHTML = ic('left'); $('#btnNext').innerHTML = ic('right'); $('#sIc').innerHTML = ic('search', 17);
  $('#newBtn').innerHTML = `${ic('plus', 18)} Nouvel événement`;
  $('#viewSeg').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };
  $('#btnToday').onclick = goToday; $('#btnPrev').onclick = () => shift(-1); $('#btnNext').onclick = () => shift(1);
  $('#btnSide').onclick = () => { D.settings.sidebarOpen = !D.settings.sidebarOpen; save(); applySettings(); renderMain(); };
  $('#btnSettings').onclick = () => openSettings(); $('#btnHelp').onclick = showHelp;
  $('#btnTheme').onclick = () => { D.settings.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; save(); applySettings(); renderTop(); renderMain(); };
  $('#newBtn').onclick = () => { const n = new Date(); editNew({ dn: S.view === 'day' || S.view === 'agenda' ? S.anchor : (S.anchor === todayDn() || ymd(S.anchor).m === n.getMonth() ? todayDn() : S.anchor), st: Math.min(23, n.getHours() + 1) * 60 }); };
  $('#q').addEventListener('input', debounce(e => { S.search = e.target.value; if (S.search.trim() && S.view !== 'agenda') { S.prevView = S.view; S.view = 'agenda'; } else if (!S.search.trim() && S.prevView) { S.view = S.prevView; S.prevView = null; } render(); }, 160));
  $('#quick').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { quickAdd(e.target.value); e.target.value = ''; } });
  /* Barre latérale (délégation) */
  $('#side').addEventListener('click', e => {
    const t = e.target;
    const mn = t.closest('[data-mn]'); if (mn) { S.mini = addMonths(S.mini, +mn.dataset.mn); return renderSide(); }
    const go = t.closest('[data-go]'); if (go) { S.anchor = +go.dataset.go; S.mini = S.anchor; if (S.view === 'year') S.view = 'month'; return render(); }
    if (t.closest('[data-org]')) return openSettings('org');
    const ta = t.closest('[data-tall]'); if (ta) { D.tags.forEach(x => x.visible = ta.dataset.tall === '1'); D.meta.showUntagged = ta.dataset.tall === '1'; save(); return render(); }
    const c = t.closest('[data-cal]'); if (c) { const o = calById(c.dataset.cal); o.visible = o.visible === false; save(); return render(); }
    const tg = t.closest('[data-tag]'); if (tg) { const o = tagById(tg.dataset.tag); o.visible = o.visible === false; save(); return render(); }
    if (t.closest('[data-untagged]')) { D.meta.showUntagged = D.meta.showUntagged === false; save(); return render(); }
    const ev = t.closest('[data-ev]'); if (ev) showEventPop(ev.dataset.ev, +ev.dataset.occ, ev.getBoundingClientRect());
  });
  $('#banner').addEventListener('click', e => { if (e.target.id === 'bRm') removeDemo(); if (e.target.id === 'bBackup') { exportJSON(); renderBanner(); } if (e.target.id === 'bKeep') { D.meta.demo = false; D.events.forEach(x => x.demo = false); save(); renderBanner(); } });
  bindView();
  /* Raccourcis clavier */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase(), typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if (DR) return;
      if (modalStack.length) return topModal().close();
      if (pop) return closePop();
      if (typing) { if (e.target.id === 'q' && S.search) { e.target.value = ''; e.target.dispatchEvent(new Event('input')); } e.target.blur(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); return redo(); }
    if (typing || modalStack.length || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const map = { m: 'month', w: 'week', d: 'day', a: 'agenda', y: 'year' };
    if (map[k]) setView(map[k]);
    else if (k === 't') goToday(); else if (k === 'n') { e.preventDefault(); $('#newBtn').click(); }
    else if (k === 'arrowleft' || k === 'k') shift(-1); else if (k === 'arrowright' || k === 'j') shift(1);
    else if (k === '/') { e.preventDefault(); $('#q').focus(); }
    else if (k === 's') openSettings(); else if (k === 'b') $('#btnSide').click(); else if (k === '?') showHelp();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (D.settings.theme === 'auto') { applySettings(); render(); } });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderMain, 120); });
  /* Horloge : ligne « maintenant », changement de jour, rappels */
  let lastDay = todayDn();
  setInterval(() => {
    if (todayDn() !== lastDay) { lastDay = todayDn(); render(); }
    $$('.now-line').forEach(l => l.style.top = nowMin() / 60 * D.settings.hourH + 'px');
    checkReminders();
  }, 20000);
  render(); setTimeout(checkReminders, 800);
  addEventListener('beforeunload', saveNow);
  addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { load(); applySettings(); render(); } });
}
document.addEventListener('DOMContentLoaded', init);

</script>
